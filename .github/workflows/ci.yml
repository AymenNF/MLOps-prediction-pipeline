name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Train and enforce quality gate
        run: PYTHONPATH=src python -m mlops_pipeline.train
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

  docker:
    needs: test-and-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlops-pipeline .
