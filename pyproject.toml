[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Starter MLOps pipeline: train, track, test and serve a scikit-learn model."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
